# cargo-deny configuration.
# Run locally with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # `paste` is unmaintained (not vulnerable). Compile-time-only proc-macro
    # pulled in via ct2rs -> tokenizers -> macro_rules_attribute for the
    # optional `translation-offline` feature; no fixed upstream release exists.
    "RUSTSEC-2024-0436",
    # `proc-macro-error2` is unmaintained (not vulnerable). Compile-time-only
    # proc-macro pulled in via tabled_derive -> tabled; no safe upgrade exists.
    "RUSTSEC-2026-0173",
]

[bans]
multiple-versions = "warn"
# "deny" once finance-query is back on a crates.io version — a git dependency
# with no semver constraint reads as a wildcard.
wildcards = "warn"
allow-wildcard-paths = true
deny = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# finance-query is temporarily a git dependency (see Cargo.toml). Drop this
# once it's back to a crates.io version.
allow-git = ["https://github.com/Verdenroz/finance-query"]
